<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact Kota Joint in Dilopye. Open 8am to 9pm. Order on WhatsApp.">
  <title>Contact | Kota Joint</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav>
    <a href="index.html">Home</a>
    <a href="menu.html">Menu</a>
    <a href="gallery.html">Gallery</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </nav>

  <main>
    <h1>Find Us</h1>
    <p><strong>Location:</strong> Dilopye</p>
    <p><strong>Hours:</strong> 8:00 AM to 9:00 PM</p>
    <p><strong>Delivery:</strong> Available for bigger orders. Ask on WhatsApp for areas and fees.</p>
    <a class="btn dark" id="wa-main" href="#" target="_blank" rel="noopener">Order on WhatsApp</a>

    <h2>Map</h2>
    <iframe title="Kota Joint location" width="100%" height="300" style="border:0;border-radius:10px"
      loading="lazy" src="https://www.google.com/maps?q=Dilopye&output=embed"></iframe>

    <h2>Send us a message</h2>
    <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" required>
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>
      <label for="message">Message</label>
      <textarea id="message" name="message" rows="4" required></textarea>
      <button type="submit" class="btn">Send</button>
    </form>
  </main>

  <footer><p>Kota Joint, Dilopye. Demo website.</p></footer>
  <script src="menu.js"></script>
  
</body>
</html>
